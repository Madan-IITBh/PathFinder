<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathfinder - IIT Bhilai Course Assistant</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header img {
            max-width: 150px;
            margin-bottom: 15px;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .checkbox-group label {
            font-weight: normal;
            display: flex;
            align-items: center;
        }
        .checkbox-group input {
            margin-right: 10px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #004494;
        }
        #result {
            margin-top: 30px;
            padding: 20px;
            background: #e9ecef;
            border-radius: 5px;
            display: none;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="{{ url_for('static', filename='logo_iit_bhilai.png') }}" alt="IIT Bhilai Logo">
        <h1>Pathfinder</h1>
        <p>Your AI Course Registration Assistant</p>
    </div>

    <div class="container">
        <form id="pathfinderForm">
            <div class="form-group">
                <label for="year">Year:</label>
                <select id="year" required>
                    <option value="" disabled selected>Select Year</option>
                    <option value="1st">1st Year</option>
                    <option value="2nd">2nd Year</option>
                    <option value="3rd">3rd Year</option>
                    <option value="4th">4th Year</option>
                </select>
            </div>

            <div class="form-group">
                <label for="semester">Semester:</label>
                <select id="semester" required>
                    <option value="" disabled selected>Select Semester</option>
                    <option value="1">Semester 1</option>
                    <option value="2">Semester 2</option>
                    <option value="3">Semester 3</option>
                    <option value="4">Semester 4</option>
                    <option value="5">Semester 5</option>
                    <option value="6">Semester 6</option>
                    <option value="7">Semester 7</option>
                    <option value="8">Semester 8</option>
                </select>
            </div>

            <div class="form-group">
                <label for="branch">Branch:</label>
                <select id="branch" required>
                    <option value="" disabled selected>Select Branch</option>
                    <option value="CSE">Computer Science and Engineering (CSE)</option>
                    <option value="DSAI">Data Science and AI (DSAI)</option>
                    <option value="ECE">Electronics and Communication (ECE)</option>
                    <option value="EE">Electrical Engineering (EE)</option>
                    <option value="ME">Mechanical Engineering (ME)</option>
                    <option value="MT">Mechatronics (MT)</option>
                    <option value="MSME">Materials Science and Metallurgical Eng. (MSME)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Interested Job Roles (Select all that apply):</label>
                <div class="checkbox-grid">
                    <div class="checkbox-group"><label><input type="checkbox" name="roles" value="Software Engineer"> Software Engineer</label></div>
                    <div class="checkbox-group"><label><input type="checkbox" name="roles" value="Data Scientist"> Data Scientist</label></div>
                    <div class="checkbox-group"><label><input type="checkbox" name="roles" value="AI/ML Engineer"> AI/ML Engineer</label></div>
                    <div class="checkbox-group"><label><input type="checkbox" name="roles" value="Hardware Engineer"> Hardware Engineer</label></div>
                    <div class="checkbox-group"><label><input type="checkbox" name="roles" value="VLSI Design Engineer"> VLSI Design</label></div>
                    <div class="checkbox-group"><label><input type="checkbox" name="roles" value="Embedded Systems Engineer"> Embedded Systems</label></div>
                    <div class="checkbox-group"><label><input type="checkbox" name="roles" value="Control Systems Engineer"> Control Systems</label></div>
                    <div class="checkbox-group"><label><input type="checkbox" name="roles" value="Mechanical Engineer"> Mechanical Engineer</label></div>
                    <div class="checkbox-group"><label><input type="checkbox" name="roles" value="Robotics Engineer"> Robotics Engineer</label></div>
                    <div class="checkbox-group"><label><input type="checkbox" name="roles" value="Materials Scientist"> Materials Scientist</label></div>
                    <div class="checkbox-group"><label><input type="checkbox" name="roles" value="Automotive Engineer"> Automotive Engineer</label></div>
                    <div class="checkbox-group"><label><input type="checkbox" name="roles" value="Product Manager"> Product Manager</label></div>
                </div>
            </div>

            <button type="submit" id="submitBtn">Get Course Recommendations</button>
        </form>

        <div id="result"></div>
    </div>

    <script>
        document.getElementById('pathfinderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const resultDiv = document.getElementById('result');
            
            btn.innerText = "Analyzing curriculum with AI...";
            btn.disabled = true;

            const year = document.getElementById('year').value;
            const semester = document.getElementById('semester').value;
            const branch = document.getElementById('branch').value;
            
            const roles = [];
            document.querySelectorAll('input[name="roles"]:checked').forEach(cb => roles.push(cb.value));

            try {
                const response = await fetch('/recommend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ year, semester, branch, job_roles: roles })
                });
                
                const data = await response.json();
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `<strong>AI Recommendation:</strong><br><br>${data.recommendation.replace(/\n/g, '<br>')}`;
            } catch (error) {
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = "Error generating recommendation. Please try again.";
            } finally {
                btn.innerText = "Get Course Recommendations";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
